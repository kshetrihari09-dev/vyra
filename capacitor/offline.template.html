<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vaspoor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F8FCFB; color: #063F50; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px; }
    .logo { width: 72px; height: 72px; border-radius: 22px; background: #0FAF8F; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
    h1 { font-size: 22px; margin: 0 0 8px; } p { margin: 0 0 26px; color: #71838C; font-size: 15px; line-height: 1.45; max-width: 300px; }
    button { border: 0; border-radius: 999px; background: #0FAF8F; color: #fff; font-weight: 700; font-size: 16px; padding: 14px 34px; min-height: 48px; }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 64 64"><path d="M14 18l18 32 18-32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1>You're offline</h1>
    <p>Vaspoor needs an internet connection. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // __SERVER_URL__ is filled in by scripts/prepare-android.mjs when the app is built.
    document.getElementById("retry").addEventListener("click", function () { window.location.replace("__SERVER_URL__/"); });
    window.addEventListener("online", function () { window.location.replace("__SERVER_URL__/"); });
  </script>
</body>
</html>
